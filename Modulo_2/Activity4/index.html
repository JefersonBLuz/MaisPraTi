<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Jeferson Braga">
    <meta name="title" content="Atividade 4">
    <meta name="description"
        content="Desenvolver uma página web utilizando HTML e CSS que contenha os principais elementos de uma estrutura de site.">
    <meta name="keywords" content="HTML, CSS">
    <link rel="stylesheet" href="assets/style.css">
    <title>Atividade 4</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
</head>

<body class="flex flex-col h-screen bg-secondary p-0">
    <header class="bg-primary border-b border-gray-800">
        <nav class="flex flex-row justify-between px-4 h-12 items-center relative">
            <!--Container logo-->
            <div class="pl-4 w-1/3 flex items-center">
                <img src="assets/img/logo.png" class="h-10" alt="Logo">
                <h1 class="title pl-2">進撃の巨人</h1>
            </div>
            <!--Container logo-->

            <!-- Botão de menu hamburguer (mobile) -->
            <button id="menu-toggle" class="md:hidden text-white focus:outline-none">
                ☰ <!-- Ícone de menu -->
            </button>

            <!--Container link-->
            <div id="menu" class="hidden absolute top-12 left-0 w-full bg-primary md:flex md:static md:w-3/4 md:justify-around md:h-full items-end">
                <div
                    class="md:w-1/2 ">
                    <ul class="flex flex-col md:flex-row w-full md:h-full items-end md:justify-around">
                        <li class="w-full text-center md:ml-2">
                            <a href="#"
                                class="block py-2 md:py-0 md:rounded-t-lg bg-tertiary hover:bg-quaternary w-full px-2 md:border-x-1 md:border-t-1 border-black">Sobre</a>
                        </li>
                        <li class="w-full text-center md:ml-2">
                            <a href="#"
                                class="block py-2 md:py-0 md:rounded-t-lg bg-tertiary hover:bg-quaternary w-full px-2 md:border-x-1 md:border-t-1 border-black">Serviços</a>
                        </li>
                        <li class="w-full text-center md:ml-2">
                            <a href="#"
                                class="block py-2 md:py-0 md:rounded-t-lg bg-tertiary hover:bg-quaternary w-full px-2 md:border-x-1 md:border-t-1 border-black">Testemunho</a>
                        </li>
                        <li class="w-full text-center md:mx-2">
                            <a href="#"
                                class="block py-2 md:py-0 md:rounded-t-lg bg-tertiary hover:bg-quaternary w-full px-2 md:border-x-1 md:border-t-1 border-black">Contato</a>
                        </li>
                    </ul>
                </div>
                <!--Container link-->

                <!--Container Fala conosco-->
                <div class="hidden md:block text-end w-1/2 pr-4 self-center">
                    <button class="btn bg-tertiary hover:bg-quaternary rounded-lg px-2 py-1 border-2 border-black">
                        <a href="#">Entre em contato</a>
                    </button>
                </div>
            </div>
            <!--Container Fala conosco-->
        </nav>
    </header>

    <section class="flex flex-col justify-center items-center h-full">
        <div class="flex flex-col justify-center items-center">
            <h1 class="text-4xl text-white">Bem-vindo ao nosso site</h1>
            <p class="text-white">Lorem ipsum dolor sit amet consectetur adipisicing elit. Quisquam, quos.</p>
        </div>
    </section>
    <script>
        document.getElementById('menu-toggle').addEventListener('click', function () {
            let menu = document.getElementById('menu');
            menu.classList.toggle('hidden');
        });
    </script>
</body>

</html>
