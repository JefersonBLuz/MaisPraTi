<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Jeferson Braga">
    <title>Atividade 5</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
</head>

<body>
    <header>
        <nav class="bg-stone-700 p-4">
            <div class="container mx-auto flex justify-center items-center">
                <h1 class="text-2xl text-white text-bold">Atividade 5 - Lista de Tarefas</h1>
            </div>
        </nav>
    </header>
    <main class="flex justify-center items-center h-screen bg-gray-100 flex-col text-gray-800">
        <section class="flex  flex-col w-full p-5 md:w-1/2 items-center">
            <div class="bg-white p-4 rounded-lg shadow-lg w-full">
                <h1 class="text-2xl font-bold text-center">Atividade 5</h1>
                <form class="mt-4">
                    <div class="mb-4 grid grid-cols-5">
                        <label for="tarefa" class="block text-sm font-medium text-gray-700 col-span-5">Tarefa</label>
                        <input type="text" name="name" id="name"
                            class="mt-2 block w-full px-3 py-2 border border-gray-300 rounded-l-xl shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm sm:col-span-4 col-span-3"
                            required>
                        <button type="submit"
                            class="mt-2 bg-stone-500 rounded-r-xl px-5 text-white cursor-pointer hover:bg-stone-700 col-span-2 sm:col-span-1">Adicionar
                            Tarefa</button>
                    </div>
                </form>
                <div class="flex justify-center mt-8">
                    <span class="border-2 border-gray-400 px-5 py-1 rounded-2xl hover:bg-gray-300 cursor-pointer" onclick="mostarTarefa()" id="botaoMostrar">
                        Mostrar Tarefas
                    </span>
                </div>
            </div>
            <div id="tarefas" class="text-black w-98/100 self-center rounded-b-lg">

            </div>
        </section>
    </main>
    <script type="text/javascript" src="assets/script.js"></script>
</body>

</html>
